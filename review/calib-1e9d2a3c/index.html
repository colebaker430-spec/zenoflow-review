.row{display:flex;gap:10px;margin-top:10px}button{flex:1;height:52px;border-radius:12px;font-size:16px;font-weight:700;border:0}
.y{background:var(--acc);color:#fff}.n{background:#fff;color:var(--fg);border:2px solid #c9ccd2}

document.querySelectorAll('.row').forEach(row=>{const r=row.dataset.r,d=row.nextElementSibling;
const send=w=>{row.style.display='none';d.style.display='block';d.textContent='Sending...';
fetch('https://ntfy.sh/zfrev-c3df061b4849dd67',{method:'POST',body:'ZFCAL-'+w+' '+r+' 0e2583c3c28d'})
.then(x=>{d.textContent=x.ok?(w==='YES'?'Saved: proud':'Saved: not good enough'):'Did not send. Tap again.';if(!x.ok)row.style.display='flex'})
.catch(()=>{d.textContent='Did not send. Tap again.';row.style.display='flex'})};
row.querySelector('.y').onclick=()=>send('YES');row.querySelector('.n').onclick=()=>send('NO');});
